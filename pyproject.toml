[project]
name = "pixie-qa-demo"
version = "0.1.0"
description = "Demo for using pixie-qa with improved manual instrumentation"
requires-python = ">=3.10"

dependencies = [
    "pixie @ git+https://github.com/yiouli/pixie-qa.git",
    "jsonpickle>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
